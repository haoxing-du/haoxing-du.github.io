baseURL = "https://www.haoxingdu.com"
languageCode = "en-us"
title = "Haoxing Du｜杜浩星"
theme = "rocinante"
paginate = 50
summaryLength = 0
publishDir = "docs"
enableGitInfo = true
buildDrafts = false
buildFuture = false
buildExpired = false

[frontmatter]
  lastmod = [":git", "lastmod", "date"]

[markup]
  [markup.highlight]
    style = "monokailight"
    tabWidth = 2
  [markup.goldmark.renderer]
    unsafe= true

[params]
  mainSections = ["post"]
  photo = "/images/me.jpg"
  photoAlt = "Photo of me"
  email = "haoxingdu@gmail.com"
  favicon = "/icon/favicon.JPG"
  socialImage = "/icon/favicon.JPG"
  about = """
Hi! I'm **Haoxing**.
I am a [proud](https://www.astralcodexten.com/p/in-continued-defense-of-effective) [effective altruist](https://80000hours.org/podcast/effective-altruism-an-introduction/) trying to help this [whole](https://aisafety.dance/) [AI](https://www.cold-takes.com/most-important-century/) [thing](https://ai-2027.com/) go well.
I'm currently working on a new project on AI behavior evaluations, incubated at [Surplus](https://surplus.dev/).
Please get in touch if you'd like to chat about this!

Most recently, I worked on predicting the weather with AI at a balloon startup called [WindBorne](https://windbornesystems.com/).
Before that, I evaluated AI models for dangerous capabilities at [METR](https://metr.org), where we poked at the first AI agents before the term "AI agent" was invented.
I also did some [research](https://www.lesswrong.com/posts/FF8i6SLfKb4g7C4EL/inside-the-mind-of-a-superhuman-go-model-how-does-leela-zero-2) on neural network interpretability at [Redwood Research](https://www.redwoodresearch.org/).

Before AI captured my entire attention I wanted to become a theoretical physicist.
At Berkeley, I did research at the intersection of machine learning and physics in the amazing [Nachman group](https://nachmangroup.github.io/).
Prior to Berkeley, I was fortunate to be part of the [Perimeter Scholars International](https://perimeterinstitute.ca/psi-masters-program) program, and had the privilege of spending the best college years possible at [Harvey Mudd College](https://www.hmc.edu).
If not for AI, I might have spent my career thinking about the foundations of quantum theory.
A few years ago, I wrote a couple of posts on quantum foundations, hoping to communicate some of my favorite recent advances to a wider audience, which you can find on this site.

When I'm not thinking about the above topics, I like to read, play video games, make music, [fly](https://www.xcontest.org/world/en/pilots/detail:haoxing) my paraglider, and climb extremely casually.

I'm happily married to [Kasey Markel](https://www.kaseymarkel.com/), and we're moving to San Francisco soon after a few years in East Bay.
We have signed the [🔸 10% Pledge](https://www.givingwhatwecan.org/pledge).
If you are reading this, please consider doing the same!

"""

